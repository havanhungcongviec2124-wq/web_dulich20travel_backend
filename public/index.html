    <h1>20 TRAVEL Backend</h1>
    <p>Đây là dịch vụ API Node.js/Express + MongoDB (<code>server.js</code>), không chạy như site tĩnh trên Cloudflare.</p>
    <p>Để triển khai API thực tế, dùng nền tảng chạy Node (Render/Railway/Fly.io/VPS) với lệnh <code>npm ci</code> và <code>node server.js</code>, cấu hình biến môi trường <code>MONGODB_URI</code>, <code>JWT_SECRET</code>.</p>
